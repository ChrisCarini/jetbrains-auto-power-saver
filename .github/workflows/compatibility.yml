name: IntelliJ Plugin Compatibility

on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g. for dependabot pull requests)
  push:
    branches: [ main ]

  # Trigger the workflow on any pull request
  pull_request:

  # Trigger the workflow on a schedule; daily
  schedule:
    - cron: '0 0 * * *'

# The concurrency group is configured to run the workflow on the latest iteration of a PR
# (and cancel workflows for older iterations).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}-${{ github.base_ref }}
  cancel-in-progress: true

jobs:
  files-changed:
    uses: ./.github/workflows/files-changed.yaml

  compatibility:
    name: Ensure plugin compatibility against targeted platform version & the latest EAP snapshot for both IDEA Community, IDEA Ultimate.

    runs-on: ubuntu-latest
    needs: files-changed
    if: needs.files-changed.outputs.SKIP_CI == 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1

      - name: Monitor disk usage
        uses: ChrisCarini/disk-usage-action@aaf40eb87330c67b4eeebba90d83e25dc3198a66 # v0.0.1

      - name: Check available disk space
        id: disk_space
        shell: bash
        env:
          MIN_FREE_DISK_GIB: '35'
        run: |
          available_kib="$(LC_ALL=C df -k --output=avail -- "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $1}')"
          if [[ ! "$available_kib" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine available disk space."
            exit 1
          fi

          threshold_kib=$((MIN_FREE_DISK_GIB * 1024 * 1024))
          echo "Available disk space: $available_kib KiB; cleanup threshold: $threshold_kib KiB ($MIN_FREE_DISK_GIB GiB)"
          printf 'available_kib=%s\nthreshold_kib=%s\n' \
            "$available_kib" "$threshold_kib" >> "$GITHUB_OUTPUT"

      - name: Free Disk Space (Ubuntu)
        # Scheduled runs add an EAP target whose disk requirements are not yet profiled.
        if: >-
          github.event_name == 'schedule' ||
          fromJSON(steps.disk_space.outputs.available_kib) < fromJSON(steps.disk_space.outputs.threshold_kib)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          # Preserve the hosted tool cache and the verifier's prebuilt Docker image.
          tool-cache: false
          docker-images: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        timeout-minutes: 5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true  # default value, defining for explicitness.

      - name: Build the plugin
        run: ./gradlew buildPlugin

      - name: Generate IDE Versions List
        run: ./gradlew generateIdeVersionsList

      - name: Verify plugin on IntelliJ Platforms
        id: verify
        uses: ChrisCarini/intellij-platform-plugin-verifier-action@main  # use `main` to self-test latest changes; `latest` was previously used
        with:
          # Generated from the `generateIdeVersionsList` task above.
          ide-versions: build/intellij-platform-plugin-verifier-action-ide-versions-file.txt
          # TODO(ChrisCarini) - This can be removed once https://youtrack.jetbrains.com/issue/MP-6711 is resolved.
          #  See below for details:
          #       - https://jetbrains-platform.slack.com/archives/C012S7PA8CQ/p1722334099316129?thread_ts=1719921236.855369&cid=C012S7PA8CQ
          #       - https://youtrack.jetbrains.com/issue/MP-6711/Plugin-Verifier-Muted-plugin-problems-show-up-in-the-standard-output-as-structure-warnings#focus=Comments-27-10232348.0-0
          failure-levels: |
            PLUGIN_STRUCTURE_WARNINGS

      - name: Get log file path and print contents
        run: |
          echo "The log file path is: ${{steps.verify.outputs.verification-output-log-filename}}" ;
          cat ${{steps.verify.outputs.verification-output-log-filename}}
